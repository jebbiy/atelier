    <link rel="stylesheet" href="style.css">
    <style>
        body.source-page { min-height:100vh; color:#fff; background:#050505 !important; background-image:none !important; }
        body.source-page main.source-shell { background:#050505 !important; background-image:none !important; box-shadow:none; border:0; }
        .source-shell { width:min(1200px,92%); margin:0 auto; padding:42px 0 70px; }
        .source-header { display:flex; align-items:end; justify-content:space-between; gap:24px; margin-bottom:34px; padding-bottom:18px; border-bottom:1px solid #333; }
        .source-header h1 { margin:0; color:#fff; font:700 clamp(46px,8vw,100px)/.8 'Century Schoolbook',Georgia,serif; letter-spacing:-.08em; }
        .source-header p { max-width:360px; margin:0; color:#aaa; font:13px/1.5 Helvetica,Arial,sans-serif; }
        .source-back { display:inline-block; align-self:flex-start; width:max-content; margin-bottom:28px; padding:7px 9px; color:#111; background:#fff; border-radius:999px; font:11px Helvetica,Arial,sans-serif; text-decoration:none; }
        .source-back:hover { color:#fff; background:#e00000; }
        .source-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px; }
        .source-item { min-width:0; padding:10px; background:#111; border:1px solid #303030; }
        .source-item img { display:block; width:100%; height:150px; object-fit:cover; background:#202020; }
        .source-item figcaption { padding:12px 2px 3px; color:#eee; font:13px Helvetica,Arial,sans-serif; overflow-wrap:anywhere; }
        @media (max-width:650px) { .source-header { display:block; } .source-header p { margin-top:18px; } .source-list { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; } .source-item img { height:120px; } }
