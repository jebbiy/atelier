<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atelier — Checkout</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Space+Mono:wght@400;700&display=swap');
        :root { color-scheme:dark; --paper:#f3f1eb; --ink:#111; --green:#66d38a; --muted:#a9a9a4; }
        * { box-sizing:border-box; }
        html, body { min-height:100%; margin:0; }
        body { color:#fff; background:#050505 url('tum.gif') center/cover fixed; font-family:'Space Mono','Courier New',monospace; }
        body::before { content:''; position:fixed; inset:0; z-index:-1; background:linear-gradient(115deg,rgba(0,0,0,.78),rgba(0,0,0,.48) 48%,rgba(0,0,0,.84)); }
        a { color:inherit; }
        .checkout-shell { width:min(1160px,calc(100% - 44px)); min-height:100vh; margin:0 auto; padding:34px 0 52px; }
        .checkout-top { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:34px; }
        .checkout-brand { margin:0; font:700 clamp(42px,8vw,100px)/.72 'PT Serif',Georgia,serif; letter-spacing:-.09em; }
        .back-home { display:inline-block; padding:13px 21px; color:#fff; border:1px solid rgba(255,255,255,.7); border-radius:0; text-decoration:none; font-size:12px; }
        .checkout-actions { display:flex; align-items:center; flex-wrap:wrap; gap:12px; margin-top:20px; }
        .checkout-actions .back-home { color:#fff; }
        .checkout-layout { display:grid; grid-template-columns:minmax(210px,.62fr) minmax(0,1.7fr); gap:18px; align-items:start; }
        .steps, .checkout-card { border:1px solid rgba(255,255,255,.32); background:rgba(12,12,12,.82); box-shadow:0 20px 60px rgba(0,0,0,.35); }
        .steps { padding:28px 24px; }
        .steps h1 { margin:0 0 30px; font:700 30px/.95 'PT Serif',Georgia,serif; }
        .step { display:flex; gap:14px; align-items:flex-start; padding:16px 0; color:var(--muted); border-top:1px dotted rgba(255,255,255,.35); transition:color .25s ease; }
        .step:first-of-type { border-top:0; }
        .step-number { display:grid; flex:none; place-items:center; width:30px; height:30px; border:1px solid currentColor; border-radius:50%; font-size:12px; }
        .step strong { display:block; color:inherit; font:700 18px/1.1 'PT Serif',Georgia,serif; }
        .step small { display:block; margin-top:7px; font-size:10px; line-height:1.4; }
        .step.is-active { color:var(--green); }
        .step.is-active .step-number { color:#08130c; background:var(--green); border-color:var(--green); }
        .step.is-complete { color:var(--muted); }
        .step.is-complete .step-number { color:var(--muted); background:transparent; border-color:var(--muted); }
        .checkout-card { position:relative; min-height:560px; padding:34px clamp(22px,5vw,62px); }
        .checkout-card h2 { margin:0 0 8px; font:700 clamp(34px,5vw,60px)/.9 'PT Serif',Georgia,serif; letter-spacing:-.05em; }
        .checkout-card .intro { margin:0 0 28px; color:#c8c8c3; font-size:12px; line-height:1.5; }
        .item-list { display:grid; gap:0; border-top:1px dotted rgba(255,255,255,.55); }
        .checkout-item { display:grid; grid-template-columns:1fr auto; gap:14px; padding:15px 0; border-bottom:1px dotted rgba(255,255,255,.55); }
        .checkout-item strong { font:16px 'PT Serif',Georgia,serif; }
        .checkout-item small { display:block; margin-top:5px; color:#aaa; font-size:11px; }
        .checkout-item-price { text-align:right; font-size:12px; }
        .checkout-total { display:flex; justify-content:space-between; gap:18px; padding:20px 0; font-size:15px; }
        .checkout-total strong { color:var(--green); font-size:18px; }
        .confirm-button, .pay-button { padding:13px 21px; color:#111; background:var(--green); border:1px solid var(--green); font:700 12px 'Space Mono','Courier New',monospace; cursor:pointer; }
        .confirm-button:hover, .pay-button:hover { color:#fff; background:transparent; }
        .confirmation-view { opacity:1; transform:translateX(0); transition:opacity .45s ease,transform .45s ease; }
        .confirmation-view.is-hidden { opacity:0; transform:translateX(-24px); pointer-events:none; }
        .payment-section { display:block; position:absolute; inset:34px clamp(22px,5vw,62px); margin:0; padding-top:0; border-top:0; opacity:0; transform:translateX(24px); pointer-events:none; transition:opacity .45s ease,transform .45s ease; }
        .payment-section.is-visible { opacity:1; transform:translateX(0); pointer-events:auto; }
        .payment-section h3 { margin:0 0 18px; font:700 28px/.95 'PT Serif',Georgia,serif; }
        .payment-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
        label { display:grid; gap:7px; color:#c8c8c3; font-size:10px; }
        input, select { width:100%; padding:12px; color:#fff; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.4); font:12px 'Space Mono','Courier New',monospace; }
        .generated-payment-number { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:42px; padding:12px; color:var(--green); background:rgba(102,211,138,.08); border:1px solid var(--green); font:700 13px 'Space Mono','Courier New',monospace; }
        .steps small, .checkout-card .intro, .checkout-item small, .checkout-item-price, label, input, select, .generated-payment-number { font-family:Helvetica,Arial,sans-serif; }
        .back-home, .confirm-button, .pay-button { font-family:Helvetica,Arial,sans-serif; }
        .payment-full { grid-column:1/-1; }
        .empty-state { color:#bbb; font-size:12px; }
        @media (max-width:720px) { .checkout-shell { width:min(100% - 24px,560px); padding-top:22px; } .checkout-top { align-items:flex-start; } .checkout-layout { grid-template-columns:1fr; } .steps { order:2; } .checkout-card { order:1; padding:28px 20px; } .payment-grid { grid-template-columns:1fr; } .payment-full { grid-column:auto; } }
    </style>
</head>
<body>
    <main class="checkout-shell">
        <header class="checkout-top">
        </header>

        <section class="checkout-layout" aria-label="Checkout Atelier">
            <aside class="steps" aria-label="Checkout steps">
                <h1>Checkout</h1>
                <div class="step is-active" id="step-confirm">
                    <span class="step-number">1</span>
                    <div><strong>Konfirmasi Item</strong><small>Periksa kembali barang dan jumlahnya.</small></div>
                </div>
                <div class="step" id="step-payment">
                    <span class="step-number">2</span>
                    <div><strong>Pembayaran</strong><small>Pilih metode pembayaran untuk menyelesaikan pesanan.</small></div>
                </div>
            </aside>

            <section class="checkout-card">
                <div class="confirmation-view" id="confirmation-view">
                    <h2>Konfirmasi Item</h2>
                    <p class="intro">Pastikan semua pilihanmu sudah benar sebelum melanjutkan ke pembayaran.</p>
                    <div class="item-list" id="checkout-items"></div>
                    <div class="checkout-total"><span>Total</span><strong id="checkout-total">Rp 0</strong></div>
                    <div class="checkout-actions"><button class="confirm-button" id="confirm-items" type="button">Konfirmasi</button><a class="back-home" href="products.html">Kembali ke toko</a></div>
                </div>

                <section class="payment-section" id="payment-section" aria-hidden="true">
                    <h3>Pembayaran</h3>
                    <div class="payment-grid">
                        <label class="payment-full">Nama lengkap<input id="customer-name" type="text" placeholder="Nama pemesan"></label>
                        <label>Email<input type="email" placeholder="nama@email.com"></label>
                        <label>Metode pembayaran<select id="payment-method"><option>Transfer bank</option><option>E-wallet</option><option>Kartu debit / kredit</option></select></label>
                        <div class="payment-full"><label for="payment-number">Nomor pembayaran</label><div class="generated-payment-number" id="payment-number" aria-live="polite"></div></div>
                    </div>
                    <div class="checkout-actions"><button class="pay-button" id="pay-button" type="button">Bayar sekarang</button><a class="back-home" href="products.html">Kembali ke toko</a></div>
                </section>
            </section>
        </section>
    </main>

    <script>
        (() => {
            const cart = JSON.parse(localStorage.getItem('atelier-cart') || '[]');
            const items = document.getElementById('checkout-items');
            const totalElement = document.getElementById('checkout-total');
            const paymentNumber = document.getElementById('payment-number');
            const formatPrice = (value) => `Rp ${Number(value || 100000).toLocaleString('id-ID')}`;
            const savedPaymentNumber = sessionStorage.getItem('atelier-payment-number');
            const generatedPaymentNumber = savedPaymentNumber || String(Math.floor(1000000000 + Math.random() * 9000000000));
            sessionStorage.setItem('atelier-payment-number', generatedPaymentNumber);
            paymentNumber.textContent = generatedPaymentNumber;
            let total = 0;
            if (!cart.length) {
                items.innerHTML = '<p class="empty-state">Keranjang masih kosong.</p>';
            } else {
                cart.forEach((item) => {
                    const price = Number(item.price || 100000);
                    total += price * item.quantity;
                    const row = document.createElement('article');
                    row.className = 'checkout-item';
                    row.innerHTML = `<div><strong>${item.name}</strong><small>${formatPrice(price)} &middot; Jumlah: ${item.quantity}</small></div><span class="checkout-item-price">${formatPrice(price * item.quantity)}</span>`;
                    items.appendChild(row);
                });
            }
            totalElement.textContent = formatPrice(total);

            document.getElementById('pay-button').addEventListener('click', () => {
                const customerName = document.getElementById('customer-name').value.trim() || 'pelanggan';
                const paymentMethod = document.getElementById('payment-method').value;
                const itemNames = cart.length
                    ? cart.map((item) => `${item.name} (x${item.quantity})`).join(', ')
                    : 'tidak ada barang';
                const message = `Halo, saya ${customerName}, telah membuat tiket pembelian untuk barang ${itemNames} bertotal ${formatPrice(total)} melalui ${paymentMethod} dengan nomor pembayaran ${generatedPaymentNumber}.`;
                window.location.href = `https://wa.me/6281224215360?text=${encodeURIComponent(message)}`;
            });

            document.getElementById('confirm-items').addEventListener('click', () => {
                document.getElementById('confirmation-view').classList.add('is-hidden');
                document.getElementById('step-confirm').classList.remove('is-active');
                document.getElementById('step-confirm').classList.add('is-complete');
                document.getElementById('step-payment').classList.add('is-active');
                document.getElementById('payment-section').classList.add('is-visible');
                document.getElementById('payment-section').setAttribute('aria-hidden', 'false');
                document.getElementById('confirm-items').style.display = 'none';
            });
        })();
    </script>
</body>
</html>
